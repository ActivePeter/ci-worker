name: Locked testkit Nix environment
description: Install Nix and realize the tested checkout without cross-runner store caching.
inputs:
  source:
    description: Tested checkout relative to the workspace.
    required: true
  output:
    description: Absolute evidence directory.
    required: true
runs:
  using: composite
  steps:
    - id: start
      shell: bash
      run: echo "ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"
    - uses: cachix/install-nix-action@v31
      with:
        install_url: https://releases.nixos.org/nix/nix-2.35.6/install
        extra_nix_config: |
          experimental-features = nix-command flakes
          max-jobs = 2
          cores = 2
          keep-env-derivations = true
          keep-outputs = true
    - name: Realize and measure this runner's environment
      shell: bash
      env:
        NIX_INSTALL_STARTED_NS: ${{ steps.start.outputs.ns }}
        NIX_SOURCE: ${{ github.workspace }}/${{ inputs.source }}
        NIX_EVIDENCE: ${{ inputs.output }}
      run: python3 "$GITHUB_ACTION_PATH/../../../ci/nix_setup.py"
