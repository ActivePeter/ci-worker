name: Save testkit Nix store from main
description: Save the verified inputs and archive together under the platform and flake lock.
runs:
  using: composite
  steps:
    - id: freeze
      continue-on-error: true
      shell: bash
      run: /usr/bin/python3 -I ciw/ci/nix_cache.py freeze --src src --meta "$RUNNER_TEMP/testkit-nix-cache"
    - if: steps.freeze.outputs.save == 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          /nix
          ${{ runner.temp }}/testkit-nix-cache/manifest.json
        key: ${{ steps.freeze.outputs.store_key }}
