name: Save testkit Nix store from main
description: One writer; archive key contains the frozen closure fingerprint.
runs:
  using: composite
  steps:
    - id: identity
      shell: bash
      run: /usr/bin/python3 -I ciw/ci/nix_cache.py identity --src src --meta "$RUNNER_TEMP/testkit-nix-cache"
    - id: freeze
      continue-on-error: true
      shell: bash
      run: /usr/bin/python3 -I ciw/ci/nix_cache.py freeze --src src --meta "$RUNNER_TEMP/testkit-nix-cache"
    - if: steps.freeze.outputs.save == 'true'
      uses: actions/cache/save@v4
      with:
        path: /nix
        key: ${{ steps.freeze.outputs.store_key }}
    - if: steps.freeze.outputs.save == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/testkit-nix-cache/manifest.json
        key: ${{ steps.identity.outputs.index_key }}
