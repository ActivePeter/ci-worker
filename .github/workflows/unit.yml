name: unit

# Reusable job DAG behind run-*-unit:
#   prepare (checkout, resolve SHA, ask the entry script for its plan, pending)
#     -> run[matrix: one job per planned id, all in parallel]
#     -> report (needs everything; the only writer of the final status).
#
# Entry script contract (.github/ci/public-unit.sh in the tested SHA; falls back
# to ci-worker's ci/defaults/<repo>.sh, reported as "legacy default"):
#   plan        stdout JSON {"version":1,"jobs":[{"id","timeout","python",
#               "rust_cache","fetch_depth"}...],"report":bool}; no side effects
#   setup <id>  optional deps; may append to $GITHUB_ENV / $GITHUB_PATH
#   run <id>    exit 0 = green; extra outputs go to $CI_OUT (uploaded)
#   report      only if plan.report: every job's $CI_OUT is in $CI_IN/job-<id>/
# All commands run from the tested repo root with github.com/goodputai/* git
# access configured (ci/git-auth.sh) and CARGO_NET_GIT_FETCH_WITH_CLI=true.

on:
  workflow_call:
    inputs:
      repo:
        type: string
        required: true
      context:
        type: string
        required: true
      default_entry:
        type: string
        required: true
      ref:
        type: string
        required: true
      base_ref:
        type: string
        default: ''
      test_setup:
        type: string
        default: legacy
      test_nix_cache:
        type: boolean
        default: false
      test_poison_host:
        type: boolean
        default: false
      verify_always:
        type: boolean
        default: false
    secrets:
      GIE_GIT_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      kind: ${{ steps.plan.outputs.kind }}
      jobs: ${{ steps.plan.outputs.jobs }}
      shared: ${{ steps.plan.outputs.shared }}
      report_jobs: ${{ steps.plan.outputs.report_jobs }}
      report: ${{ steps.plan.outputs.report }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ciw
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GIE_GIT_TOKEN }}
          path: src
          persist-credentials: false
      - name: Configure goodputai git access
        env:
          GIE_GIT_TOKEN: ${{ secrets.GIE_GIT_TOKEN }}
        run: bash ciw/ci/git-auth.sh
      - name: Plan jobs and mark pending
        id: plan
        env:
          GIE_GIT_TOKEN: ${{ secrets.GIE_GIT_TOKEN }}
          REPO: ${{ inputs.repo }}
          CONTEXT: ${{ inputs.context }}
          DEFAULT_ENTRY: ${{ inputs.default_entry }}
          SRC: src
          CIW: ciw
          CI_BASE_REF: ${{ inputs.base_ref }}
          TEST_UNIT_SETUP: ${{ inputs.test_setup }}
        run: /usr/bin/python3 -I ciw/ci/plan.py


  shared:
    needs: prepare
    if: needs.prepare.outputs.shared != ''
    name: ${{ fromJSON(needs.prepare.outputs.shared || '{}').id || 'shared' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.shared || '{}').timeout || 60 }}
    outputs:
      verification_fingerprint: ${{ steps.produce.outputs.verification_fingerprint }}
    env:
      TEST_UNIT_SETUP: ${{ inputs.test_setup }}
      TEST_UNIT_POISON_HOST: ${{ inputs.test_poison_host && '1' || '0' }}
      CI_ENTRY_KIND: ${{ needs.prepare.outputs.kind }}
      CI_JOB: ${{ fromJSON(needs.prepare.outputs.shared || '{}').id }}
      CI_REF_SHA: ${{ needs.prepare.outputs.sha }}
      CI_OUT: ${{ github.workspace }}/.ci-out
      CI_SHARED: ${{ github.workspace }}/.ci-shared
    steps:
      - uses: actions/checkout@v4
        with:
          path: ciw
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ secrets.GIE_GIT_TOKEN }}
          path: src
          persist-credentials: false
          fetch-depth: ${{ fromJSON(needs.prepare.outputs.shared).fetch_depth }}
      - name: Configure goodputai git access
        env:
          GIE_GIT_TOKEN: ${{ secrets.GIE_GIT_TOKEN }}
        run: |
          bash ciw/ci/git-auth.sh
          mkdir -p "$CI_OUT" "$CI_SHARED"
          if [ '${{ needs.prepare.outputs.kind }}' = target ]; then
            echo "ENTRY=$GITHUB_WORKSPACE/src/.github/ci/public-unit.sh" >> "$GITHUB_ENV"
          else
            echo "ENTRY=$GITHUB_WORKSPACE/ciw/${{ inputs.default_entry }}" >> "$GITHUB_ENV"
          fi
      - name: Restore verified Nix bootstrap cache
        if: inputs.repo == 'goodputai/test' && inputs.test_setup == 'nix' && inputs.test_nix_cache
        uses: ./ciw/.github/actions/nix-cache-restore
      - name: setup shared inputs
        id: setup
        working-directory: src
        run: bash "$GITHUB_WORKSPACE/ciw/ci/entry.sh" setup "$CI_JOB"
      - name: Restore target-owned shared inputs
        id: cache
        if: steps.setup.outputs.cache_key != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CI_SHARED }}
          key: ciw-shared-v1-${{ inputs.repo }}-${{ steps.setup.outputs.cache_key }}
      - name: Prepare and verify shared inputs
        id: produce
        working-directory: src
        run: bash "$GITHUB_WORKSPACE/ciw/ci/entry.sh" run "$CI_JOB"
      - name: Save target-owned shared inputs
        if: steps.setup.outputs.cache_key != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CI_SHARED }}
          key: ciw-shared-v1-${{ inputs.repo }}-${{ steps.setup.outputs.cache_key }}
      - name: Publish one shared snapshot for all consumers
        uses: actions/upload-artifact@v4
        with:
          name: shared-inputs
          path: ${{ env.CI_SHARED }}
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Record shared job result
        if: always()
        run: echo '${{ job.status }}' > "$CI_OUT/.ci-job-status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: job-${{ env.CI_JOB }}
          path: ${{ env.CI_OUT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  run:
    needs: [prepare, shared]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.shared.result == 'success' || needs.shared.result == 'skipped') }}
    name: ${{ matrix.id }}
    runs-on: ubuntu-24.04
    # Existing test revisions request 60m; Rust cold builds include the signature control.
    timeout-minutes: ${{ inputs.repo == 'goodputai/test' && startsWith(matrix.id, 'nix-cpu-mocker-rust') && 120 || matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.jobs) }}
    env:
      TEST_UNIT_SETUP: ${{ inputs.test_setup }}
      TEST_UNIT_POISON_HOST: ${{ inputs.test_poison_host && '1' || '0' }}
      CI_ENTRY_KIND: ${{ needs.prepare.outputs.kind }}
      CI_JOB: ${{ matrix.id }}
      CI_BASE_REF: ${{ inputs.base_ref }}
      CI_OUT: ${{ github.workspace }}/.ci-out
      CI_REF_SHA: ${{ needs.prepare.outputs.sha }}
      CI_SHARED: ${{ github.workspace }}/.ci-shared
    steps:
      - uses: actions/checkout@v4
        with:
          path: ciw
          persist-credentials: false
      - name: Verification marker key
        id: verification
        if: matrix.verification && !inputs.verify_always && !inputs.test_poison_host
        env:
          VERIFICATION_FINGERPRINT: ${{ needs.shared.outputs.verification_fingerprint }}
          VERIFICATION_PLAN: ${{ toJSON(matrix.verification) }}
        run: /usr/bin/python3 -I ciw/ci/verification.py key
      - name: Look up verified fingerprint
        id: verification-lookup
        continue-on-error: true
        if: steps.verification.outputs.key != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ci-verified/${{ matrix.verification.suite }}/result.json
          key: ${{ steps.verification.outputs.key }}
          lookup-only: true
      - name: Read verification receipt
        id: verification-read
        continue-on-error: true
        if: steps.verification-lookup.outputs.cache-hit == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ci-verified/${{ matrix.verification.suite }}/result.json
          key: ${{ steps.verification.outputs.key }}
      - name: Record verified skip
        id: verified
        if: steps.verification-read.outputs.cache-hit == 'true'
        env:
          VERIFICATION_FINGERPRINT: ${{ needs.shared.outputs.verification_fingerprint }}
          VERIFICATION_PLAN: ${{ toJSON(matrix.verification) }}
          VERIFICATION_MARKER: ${{ runner.temp }}/ci-verified/${{ matrix.verification.suite }}/result.json
        run: /usr/bin/python3 -I ciw/ci/verification.py skip
      - uses: actions/checkout@v4
        if: steps.verified.outputs.skip != 'true'
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ secrets.GIE_GIT_TOKEN }}
          path: src
          persist-credentials: false
          fetch-depth: ${{ matrix.fetch_depth }}
      - name: Configure goodputai git access
        if: steps.verified.outputs.skip != 'true'
        env:
          GIE_GIT_TOKEN: ${{ secrets.GIE_GIT_TOKEN }}
        run: |
          bash ciw/ci/git-auth.sh
          mkdir -p "$CI_OUT"
          if [ '${{ needs.prepare.outputs.kind }}' = target ]; then
            echo "ENTRY=$GITHUB_WORKSPACE/src/.github/ci/public-unit.sh" >> "$GITHUB_ENV"
          else
            echo "ENTRY=$GITHUB_WORKSPACE/ciw/${{ inputs.default_entry }}" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-go@v5
        if: steps.verified.outputs.skip != 'true' && matrix.go
        with:
          go-version: ${{ matrix.go_version }}
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - uses: actions/setup-node@v4
        if: steps.verified.outputs.skip != 'true' && matrix.node != ''
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        if: steps.verified.outputs.skip != 'true' && matrix.pnpm != ''
        with:
          version: ${{ matrix.pnpm }}
      - uses: astral-sh/setup-uv@v6
        if: steps.verified.outputs.skip != 'true' && inputs.test_setup != 'nix'
        with:
          enable-cache: false
      - uses: actions/setup-python@v5
        if: steps.verified.outputs.skip != 'true' && inputs.test_setup != 'nix' && matrix.python != ''
        with:
          python-version: ${{ matrix.python }}
      - name: Select Rust toolchain
        if: steps.verified.outputs.skip != 'true' && inputs.test_setup != 'nix' && matrix.rust_cache
        working-directory: src
        run: rustup show active-toolchain || rustup show
      - uses: Swatinem/rust-cache@v2
        if: steps.verified.outputs.skip != 'true' && inputs.test_setup != 'nix' && matrix.rust_cache
        with:
          workspaces: src
          prefix-key: v1-${{ inputs.repo }}
          shared-key: ${{ matrix.id }}
          cache-on-failure: true
      - name: Restore verified Nix cache
        if: steps.verified.outputs.skip != 'true' && inputs.repo == 'goodputai/test' && inputs.test_setup == 'nix' && inputs.test_nix_cache && matrix.id != 'fresh-container-lifecycle' && matrix.id != 'fresh-nix-daemon'
        uses: ./ciw/.github/actions/nix-cache-restore
      - name: Record cache exclusion for daemon lifecycle
        if: steps.verified.outputs.skip != 'true' && inputs.repo == 'goodputai/test' && inputs.test_setup == 'nix' && inputs.test_nix_cache && (matrix.id == 'fresh-container-lifecycle' || matrix.id == 'fresh-nix-daemon')
        run: echo '{"state":"skipped","reason":"requires a clean multi-user Nix daemon install"}' | tee "$CI_OUT/nix-cache-restore.json"
      - name: Download shared inputs
        if: steps.verified.outputs.skip != 'true' && matrix.shared
        uses: actions/download-artifact@v4
        with:
          name: shared-inputs
          path: ${{ env.CI_SHARED }}
      - name: setup ${{ matrix.id }}
        if: steps.verified.outputs.skip != 'true'
        working-directory: src
        run: |
          if [[ "$CI_JOB" == static && "${{ inputs.repo }}" == goodputai/test && "$TEST_UNIT_SETUP" == nix && "${{ inputs.test_nix_cache }}" == true ]]; then
            TEST_UNIT_SETUP=nix bash "$GITHUB_WORKSPACE/ciw/ci/entry.sh" setup "$CI_JOB"
          else
            bash "$GITHUB_WORKSPACE/ciw/ci/entry.sh" setup "$CI_JOB"
          fi
      - name: run ${{ matrix.id }}
        if: steps.verified.outputs.skip != 'true'
        working-directory: src
        run: bash "$GITHUB_WORKSPACE/ciw/ci/entry.sh" run "$CI_JOB"
      - name: Save Nix cache (main static job only)
        if: steps.verified.outputs.skip != 'true' && inputs.repo == 'goodputai/test' && inputs.test_setup == 'nix' && inputs.test_nix_cache && matrix.id == 'static' && github.ref == 'refs/heads/main'
        uses: ./ciw/.github/actions/nix-cache-save
      - name: Record job result
        if: always()
        run: echo '${{ job.status }}' > "$CI_OUT/.ci-job-status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: job-${{ matrix.id }}
          path: ${{ env.CI_OUT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  report:
    needs: [prepare, shared, run]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      verified_markers: ${{ steps.markers.outputs.markers }}
    env:
      TEST_UNIT_SETUP: ${{ inputs.test_setup }}
      TEST_UNIT_POISON_HOST: ${{ inputs.test_poison_host && '1' || '0' }}
      CI_ENTRY_KIND: ${{ needs.prepare.outputs.kind }}
      CI_IN: ${{ github.workspace }}/.ci-in
      CI_OUT: ${{ github.workspace }}/.ci-out
      CI_REF_SHA: ${{ needs.prepare.outputs.sha }}
      CI_SHARED: ${{ github.workspace }}/.ci-shared
    steps:
      - uses: actions/checkout@v4
        with:
          path: ciw
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: needs.prepare.result == 'success'
        with:
          pattern: job-*
          path: ${{ env.CI_IN }}
      - uses: actions/checkout@v4
        if: needs.prepare.outputs.report == 'true'
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ secrets.GIE_GIT_TOKEN }}
          path: src
          persist-credentials: false
      - name: Restore verified Nix cache for audit
        if: needs.prepare.outputs.report == 'true' && inputs.repo == 'goodputai/test' && inputs.test_setup == 'nix' && inputs.test_nix_cache
        uses: ./ciw/.github/actions/nix-cache-restore
      - name: Entry report (cross-job audit)
        id: entry
        if: needs.prepare.outputs.report == 'true'
        working-directory: src
        env:
          GIE_GIT_TOKEN: ${{ secrets.GIE_GIT_TOKEN }}
        run: |
          bash "$GITHUB_WORKSPACE/ciw/ci/git-auth.sh"
          mkdir -p "$CI_OUT"
          if [ '${{ needs.prepare.outputs.kind }}' = target ]; then
            entry="$GITHUB_WORKSPACE/src/.github/ci/public-unit.sh"
          else
            entry="$GITHUB_WORKSPACE/ciw/${{ inputs.default_entry }}"
          fi
          set +e
          ENTRY="$entry" bash "$GITHUB_WORKSPACE/ciw/ci/entry.sh" report
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: Upload report outputs
        if: needs.prepare.outputs.report == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: ${{ env.CI_OUT }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Prepare pass markers from audited real results
        id: markers
        if: needs.run.result == 'success' && steps.entry.outputs.rc == '0' && needs.shared.outputs.verification_fingerprint != '' && !inputs.test_poison_host
        env:
          JOBS: ${{ needs.prepare.outputs.report_jobs }}
          VERIFICATION_FINGERPRINT: ${{ needs.shared.outputs.verification_fingerprint }}
          VERIFICATION_ROOT: ${{ runner.temp }}/ci-verified
        run: /usr/bin/python3 -I ciw/ci/verification.py publish
      - name: Upload only small verification receipts
        if: steps.markers.outputs.markers != '' && steps.markers.outputs.markers != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: verification-markers
          path: ${{ runner.temp }}/ci-verified
          if-no-files-found: error
          retention-days: 1
      - name: Final status (only writer)
        if: always()
        env:
          GIE_GIT_TOKEN: ${{ secrets.GIE_GIT_TOKEN }}
          REPO: ${{ inputs.repo }}
          CONTEXT: ${{ inputs.context }}
          SHA: ${{ needs.prepare.outputs.sha }}
          KIND: ${{ needs.prepare.outputs.kind }}
          JOBS: ${{ needs.prepare.outputs.report_jobs }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          RUN_RESULT: ${{ needs.run.result }}
          REPORT_JOB_RESULT: ${{ job.status }}
          REPORT_RC: ${{ needs.prepare.outputs.report == 'true' && (steps.entry.outputs.rc || 'missing') || '' }}
        run: /usr/bin/python3 -I ciw/ci/report.py


  save-verification:
    needs: report
    if: needs.report.result == 'success' && needs.report.outputs.verified_markers != '' && needs.report.outputs.verified_markers != '[]'
    name: save-verification / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.report.outputs.verified_markers) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verification-markers
          path: ${{ runner.temp }}/ci-verified
      - uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ci-verified/${{ matrix.suite }}/result.json
          key: ${{ matrix.key }}
