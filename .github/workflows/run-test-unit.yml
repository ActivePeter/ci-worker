name: run-test-unit

# Public CI for goodputai/test (testkit static + sharded unit). Job DAG lives in unit.yml: prepare -> parallel
# jobs from the tested SHA's .github/ci/public-unit.sh (or ci-worker's
# ci/defaults/test.sh as "legacy default") -> report, the only writer of ci/public-worker/test-unit.
# Latest wins per PR / branch: a newer head cancels the superseded run.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "branch / tag / full SHA to run unit CI on"
        required: true
      setup:
        description: "PR proof override: legacy or nix; empty uses TEST_UNIT_SETUP (default legacy)"
        required: false
        default: ''
      nix_cache:
        description: "Verified GHA Nix store cache: auto follows TEST_UNIT_NIX_CACHE; off is the cold control"
        type: choice
        options: ["auto", "on", "off"]
        default: auto
      poison_host:
        description: "Negative control: remove host rustc and replace host Python"
        type: boolean
        default: false
      verify_always:
        description: "Execute all suites even if an exact verification marker exists"
        type: boolean
        default: false
  repository_dispatch:
    types: [run-test-unit]

permissions:
  contents: read
  actions: read

concurrency:
  group: run-test-unit-${{ github.event.client_payload.group || github.event.client_payload.ref || github.event.inputs.ref }}-${{ github.event.client_payload.setup || github.event.inputs.setup || vars.TEST_UNIT_SETUP || 'legacy' }}-${{ (github.event.client_payload.poison_host == true || github.event.inputs.poison_host == 'true') && 'poison' || 'clean' }}
  cancel-in-progress: true

jobs:
  unit:
    uses: ./.github/workflows/unit.yml
    with:
      repo: goodputai/test
      context: ${{ (github.event.client_payload.poison_host == true || github.event.inputs.poison_host == 'true') && format('ci/public-worker/test-unit-host-poison-{0}', github.event.client_payload.setup || github.event.inputs.setup || vars.TEST_UNIT_SETUP || 'legacy') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && 'ci/public-worker/test-unit-branch-proof' || 'ci/public-worker/test-unit') }}
      default_entry: ci/defaults/test.sh
      test_setup: ${{ github.event.client_payload.setup || github.event.inputs.setup || vars.TEST_UNIT_SETUP || 'legacy' }}
      test_nix_cache: ${{ (github.event.client_payload.nix_cache || (github.event.inputs.nix_cache != 'auto' && github.event.inputs.nix_cache) || vars.TEST_UNIT_NIX_CACHE || 'off') == 'on' }}
      test_poison_host: ${{ github.event.client_payload.poison_host == true || github.event.inputs.poison_host == 'true' }}
      verify_always: ${{ github.event.inputs.verify_always == 'true' }}
      affected_base: ${{ github.event.client_payload.base || '' }}
      request_source: ${{ github.event.client_payload.source || '' }}
      request_group: ${{ github.event.client_payload.group || '' }}
      ref: ${{ github.event.client_payload.ref || github.event.inputs.ref || 'main' }}
    secrets:
      GIE_GIT_TOKEN: ${{ secrets.GIE_GIT_TOKEN }}
