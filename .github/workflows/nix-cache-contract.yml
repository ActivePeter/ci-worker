name: Nix cache contract
on:
  pull_request:
  workflow_dispatch:
    inputs:
      prime_w1:
        description: Prime the branch-local W1 proof cache from a testkit main pin
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: ciw
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: goodputai/test
          ref: 75f2b653831e98acfacd6017c3203a9684c0abdb
          token: ${{ secrets.GIE_GIT_TOKEN }}
          path: src
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Worker policy and existing regressions
        working-directory: ciw
        run: /usr/bin/python3 -m unittest discover -s ci -p 'test_*.py'
      - name: Real dependency corruption rejects and cold-recovers
        run: /usr/bin/python3 ciw/ci/nix_cache_contract.py --src src
      - name: Removing restore verification reproduces the leak
        shell: bash
        run: |
          set +e
          /usr/bin/python3 ciw/ci/nix_cache_contract.py --src src --mutation skip-verify > negative.json
          rc=$?
          set -e
          test "$rc" = 1
          /usr/bin/python3 -I -c 'import json; d=json.loads(open("negative.json").read().splitlines()[-1]); assert d["corrupt_dependency_accepted"] and d["negative_control_reproduced"]'
          cat negative.json

  restore-bootstrap-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: ciw
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: goodputai/test
          ref: fd65a4e6398702caf0eaab1a1662928615ce950b
          token: ${{ secrets.GIE_GIT_TOKEN }}
          path: src
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Verify from restored bootstrap with no Nix on PATH
        run: /usr/bin/python3 ciw/ci/nix_cache_contract.py --src src --bootstrap-order
      - name: Unbound bootstrap must reproduce rejected-cold
        shell: bash
        run: |
          set +e
          /usr/bin/python3 ciw/ci/nix_cache_contract.py --src src --bootstrap-order --mutation unbound-bootstrap > negative.json
          rc=$?
          set -e
          test "$rc" = 1
          grep -F 'Nix tool nix-store not found' negative.json
          /usr/bin/python3 -I -c 'import json; d=json.loads(open("negative.json").read().splitlines()[-1]); assert d["state"] == "rejected-cold", d'
          cat negative.json

  prime-w1:
    if: github.event_name == 'workflow_dispatch' && inputs.prime_w1 && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI_JOB: static
      CI_REF_SHA: fd65a4e6398702caf0eaab1a1662928615ce950b
      TESTKIT_NIX_CACHE_BRANCH_PROOF: '1'
      TEST_UNIT_SETUP: nix
    steps:
      - uses: actions/checkout@v4
        with:
          path: ciw
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: goodputai/test
          ref: ${{ env.CI_REF_SHA }}
          token: ${{ secrets.GIE_GIT_TOKEN }}
          fetch-depth: 0
          path: src
          persist-credentials: false
      - name: Prepare a real Nix environment for the branch cache
        working-directory: src
        run: bash nix/ci.sh setup
      - name: Publish the branch-local proof cache
        uses: ./ciw/.github/actions/nix-cache-save
