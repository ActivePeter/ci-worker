name: poll-dynamo

# Queue untested branch heads and open non-fork PRs for the Dynamo contract branches.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: "only poll this eligible ref (empty = both target branches and their open PRs)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: ci
      - name: Queue public unit CI for goodputai/dynamo refs that need it
        env:
          GIE_GIT_TOKEN: ${{ secrets.GIE_GIT_TOKEN }}
          POLL_REF: ${{ github.event.inputs.ref }}
        run: >-
          bash ci/poll.sh goodputai/dynamo ci/public-worker/dynamo-unit run-dynamo-unit
          "$POLL_REF" "release/1.6.1,claude/bp890-pickq-1124"
