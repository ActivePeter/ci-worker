name: Build SGLang 0.5.21 PPU15 engine

# Engine-mode equivalent of goodputai/sglang
# .github/workflows/build-ppu15-0.5.21-engine.yml (contract-test +
# qualify-or-build, mode=engine), moved here because the sglang repository's
# own Actions budget no longer starts jobs. Build steps are kept verbatim;
# deviations are limited to repository/ref, runner, disk path and credentials.

on:
  workflow_dispatch:
    inputs:
      sglang_ref:
        description: Full 40-hex goodputai/sglang commit on ppu15-0.5.21
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sglang-ppu15-0.5.21-immutable-publication
  cancel-in-progress: false

env:
  SGLANG_SOURCE_COMMIT: ${{ inputs.sglang_ref }}
  SGLANG_BRANCH: ppu15-0.5.21

jobs:
  contract-test:
    runs-on: ubuntu-latest
    outputs:
      cache_ready: ${{ steps.cache.outputs.ready }}
    steps:
      - name: Validate source input
        env:
          GH_TOKEN: ${{ secrets.GIE_GIT_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$SGLANG_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          status=$(gh api "repos/goodputai/sglang/compare/${SGLANG_SOURCE_COMMIT}...${SGLANG_BRANCH}" -q .status)
          echo "compare ${SGLANG_SOURCE_COMMIT}...${SGLANG_BRANCH}: $status"
          [[ "$status" == identical || "$status" == ahead ]] || {
            echo "Refused: $SGLANG_SOURCE_COMMIT is not on $SGLANG_BRANCH" >&2; exit 1;
          }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: goodputai/sglang
          ref: ${{ inputs.sglang_ref }}
          token: ${{ secrets.GIE_GIT_TOKEN }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$SGLANG_SOURCE_COMMIT"
      - run: python3 -m unittest discover -s test/manual/ppu -p 'test_*.py' -v
      - name: Verify complete source and JIT lock
        run: python3 python/sglang/_build/ppu/check_build_inputs.py
      - name: Resolve publication eligibility
        id: cache
        run: |
          . docker/ppu15-0.5.21-image.env
          if [[ -z "$DEEP_GEMM_CACHE_DIGEST" || "$RUNTIME_LOCKS_FINALIZED" != true ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            [[ "$DEEP_GEMM_CACHE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  build-engine:
    needs: contract-test
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ACR_REGISTRY_URL: goodputai-registry.cn-hangzhou.cr.aliyuncs.com
      # Everything large (podman store, skopeo staging) lives on the LVM volume.
      WORK: /build/ppu15-v0521
    steps:
      - name: Clean hosted runner disk
        run: |
          set -euo pipefail
          df -h / /mnt
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift /opt/az
          docker system prune --all --force --volumes
          sudo systemctl stop docker.service docker.socket
          df -h / /mnt

      - name: Combine root and temporary disk space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          build-mount-path: /build
          build-mount-path-ownership: runner:runner
          root-reserve-mb: '10240'
          temp-reserve-mb: '2048'
          swap-size-mb: '2048'

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: goodputai/sglang
          ref: ${{ inputs.sglang_ref }}
          token: ${{ secrets.GIE_GIT_TOKEN }}
          persist-credentials: false

      - name: Install OCI builder and check workspace capacity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SGLANG_SOURCE_COMMIT"
          mountpoint /build
          sudo apt-get update
          sudo apt-get install -y podman skopeo
          python3 - <<'PY'
          import shutil
          free = shutil.disk_usage('/build').free
          if free < 80 * 1024**3:
              raise SystemExit(f"PPU15 toolchain requires 80 GiB free on /build, found {free}")
          PY
          df -h / /build

      - name: Build complete immutable engine
        env:
          ACR_REGISTRY_USERNAME: ${{ secrets.ACR_REGISTRY_USERNAME }}
          ACR_REGISTRY_PASSWORD: ${{ secrets.ACR_REGISTRY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . docker/ppu15-0.5.21-image.env
          set +a
          [[ "$REGISTRY" == "$ACR_REGISTRY_URL" ]]
          [[ -n "$ACR_REGISTRY_USERNAME" && -n "$ACR_REGISTRY_PASSWORD" ]]
          [[ "$IMAGE_REPOSITORY" == "goodputai/sglang" ]]
          [[ "$BASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ -z "$(git status --porcelain)" ]]
          mode=engine
          [[ "$RUNTIME_LOCKS_FINALIZED" == true ]] || { echo 'Engine refused: runtime lock qualification is pending.' >&2; exit 1; }
          generate_runtime_locks=0
          [[ "$DEEP_GEMM_CACHE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo 'Engine refused: no 0.5.21 qualified cache digest.' >&2; exit 1;
          }
          cache_pin="$DEEP_GEMM_CACHE_IMAGE@$DEEP_GEMM_CACHE_DIGEST"
          epoch="$(git show -s --format=%ct "$SGLANG_SOURCE_COMMIT")"
          tag="$(python3 python/sglang/_build/ppu/image_identity.py --source-commit "$SGLANG_SOURCE_COMMIT" --commit-epoch "$epoch" --tag-prefix "$TAG_PREFIX")"
          echo "image tag: $tag"
          work="$WORK"
          mkdir -p "$work/staging" "$work/store" "$work/run"
          python3 - "$work/auth.json" <<'PY'
          import base64, json, os, sys
          credential = base64.b64encode((os.environ['ACR_REGISTRY_USERNAME']+':'+os.environ['ACR_REGISTRY_PASSWORD']).encode()).decode()
          with open(sys.argv[1], 'w') as f:
              json.dump({'auths': {os.environ['ACR_REGISTRY_URL']: {'auth': credential}}}, f)
          os.chmod(sys.argv[1], 0o600)
          PY
          transport="containers-storage:[overlay@$work/store+$work/run]"
          runtime=(sudo podman --root "$work/store" --runroot "$work/run")
          pins=("$BASE_IMAGE@$BASE_DIGEST" "$cache_pin")
          for pin in "${pins[@]}"; do
            sudo skopeo --tmpdir "$work/staging" copy --preserve-digests --authfile "$work/auth.json" "docker://$pin" "${transport}${pin%@*}:build-base-${pin##*@sha256:}"
          done
          df -h / /build
          python3 python/sglang/_build/ppu/wheel_overlay.py fetch \
            --plan docker/ppu15-0.5.21-wheel-overlay.lock.json --wheels docker/ppu15-0.5.21-wheels
          python3 -m pip download --disable-pip-version-check --require-hashes --no-deps \
            --only-binary=:all: --platform manylinux2014_x86_64 --implementation cp \
            --python-version 3.12 --abi cp312 --dest docker/ppu15-0.5.21-build-wheels \
            --requirement docker/ppu15-0.5.21-builddeps.lock
          "${runtime[@]}" build --network=none --ignorefile docker/ppu15-0.5.21-engine.Dockerfile.dockerignore --format oci --timestamp "$epoch" --pull=never \
            --target "$mode" -f docker/ppu15-0.5.21-engine.Dockerfile \
            --build-arg BASE_IMAGE="$BASE_IMAGE" --build-arg BASE_DIGEST="$BASE_DIGEST" \
            --build-arg DEEP_GEMM_CACHE_PIN="$cache_pin" \
            --build-arg DEEP_GEMM_CACHE_IMAGE="$DEEP_GEMM_CACHE_IMAGE" --build-arg DEEP_GEMM_CACHE_DIGEST="$DEEP_GEMM_CACHE_DIGEST" \
            --build-arg SOURCE_COMMIT="$SGLANG_SOURCE_COMMIT" --build-arg IMAGE_TAG="$tag" \
            --build-arg GENERATE_RUNTIME_LOCKS="$generate_runtime_locks" \
            -t "localhost/ppu15-engine:$tag" .
          df -h / /build
          gates=(--profile m890p --require-serving-import --require-cache)
          "${runtime[@]}" run --network none --entrypoint python3 "localhost/ppu15-engine:$tag" /usr/local/lib/python3.12/site-packages/sglang/_build/ppu/runtime_contract.py "${gates[@]}" > carrier-contract.json
          # Exercise CPU-tensor fixtures using the qualified PPU platform ABI.
          # Native kernels still require the separate reserved-node campaign.
          "${runtime[@]}" run --network none --entrypoint python3 \
            -v "$GITHUB_WORKSPACE:/validation:ro" --workdir /validation \
            -e PYTHONPATH=/validation/python -e PYTHONDONTWRITEBYTECODE=1 \
            -e SGLANG_PLATFORM=ppu -e SGLANG_USE_CPU_ENGINE=0 -e OMP_NUM_THREADS=2 \
            -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 \
            "localhost/ppu15-engine:$tag" \
            /validation/test/manual/ppu/run_verified_backport_cpu_tests.py
          sudo python3 python/sglang/_build/ppu/publish_image.py \
            --source "${transport}localhost/ppu15-engine:$tag" --target "$REGISTRY/$IMAGE_REPOSITORY:$tag" \
            --source-commit "$SGLANG_SOURCE_COMMIT" --commit-epoch "$epoch" --authfile "$work/auth.json" \
            --tmpdir "$work/staging" --output "$GITHUB_WORKSPACE/engine-verdict.json"
          cat engine-verdict.json >> "$GITHUB_STEP_SUMMARY"
      - name: Revoke task-owned registry auth
        if: always()
        run: sudo rm -f "$WORK/auth.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ppu15-v0521-build-verdict
          path: |
            carrier-contract.json
            engine-verdict.json
          if-no-files-found: warn
